<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Simulasi Robot Grid Dinamis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    canvas {
      border: 1px solid black;
      margin-top: 10px;
    }
    button, input {
      margin: 4px;
    }
  </style>
</head>
<body>

<h3>Simulasi Navigasi Multi-Robot Berbasis Grid Dinamis</h3>

Jumlah Baris:
<input type="number" id="rowsInput" value="6" min="2">
Jumlah Kolom:
<input type="number" id="colsInput" value="6" min="2">
<button onclick="generateGrid()">Generate Grid</button>

<br>

<button onclick="setMode(0)">Jalur Aman (0)</button>
<button onclick="setMode(1)">Obstacle / Goal (1)</button>
<button onclick="setMode(2)">Robot (2)</button>
<button onclick="startSimulation()">Mulai</button>

<br>

<canvas id="gridCanvas" width="420" height="420"></canvas>

<script>
const canvas = document.getElementById("gridCanvas");
const ctx = canvas.getContext("2d");

let rows = 6;
let cols = 6;
let cellSize = 60;
let mode = 0;

let grid = [];
let robotPos = null;
let goalPos = null;
let pathMemory = [];

function generateGrid() {
  rows = parseInt(document.getElementById("rowsInput").value);
  cols = parseInt(document.getElementById("colsInput").value);

  cellSize = Math.min(
    canvas.width / cols,
    canvas.height / rows
  );

  grid = Array.from({ length: rows }, () =>
    Array(cols).fill(0)
  );

  robotPos = null;
  goalPos = null;
  pathMemory = [];

  drawGrid();
}

function setMode(m) {
  mode = m;
}

canvas.addEventListener("click", function(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / cellSize);
  const y = Math.floor((e.clientY - rect.top) / cellSize);

  if (x < 0 || y < 0 || x >= cols || y >= rows) return;

  if (mode === 2) {
    // Pastikan hanya satu robot
    if (robotPos) {
      grid[robotPos.y][robotPos.x] = 0;
    }
    robotPos = { x, y };
  }

  grid[y][x] = mode;
  drawGrid();
});

function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] === 1) ctx.fillStyle = "gray";
      else if (grid[y][x] === 2) ctx.fillStyle = "blue";
      else ctx.fillStyle = "white";

      ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
      ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
    }
  }
}

function startSimulation() {
  if (!robotPos) {
    alert("Letakkan robot terlebih dahulu.");
    return;
  }

  // Ambil obstacle pertama sebagai goal
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] === 1) {
        goalPos = { x, y };
        break;
      }
    }
    if (goalPos) break;
  }

  if (!goalPos) {
    alert("Tidak ada goal (obstacle) yang dipilih.");
    return;
  }

  pathMemory = findPath(robotPos, goalPos);
  moveRobot(pathMemory);
}

function findPath(start, goal) {
  let queue = [];
  let visited = Array.from({ length: rows }, () =>
    Array(cols).fill(false)
  );
  let parent = Array.from({ length: rows }, () =>
    Array(cols).fill(null)
  );

  queue.push(start);
  visited[start.y][start.x] = true;

  const dirs = [
    { x: 1, y: 0 },
    { x: -1, y: 0 },
    { x: 0, y: 1 },
    { x: 0, y: -1 }
  ];

  while (queue.length > 0) {
    let current = queue.shift();

    if (current.x === goal.x && current.y === goal.y) break;

    for (let d of dirs) {
      let nx = current.x + d.x;
      let ny = current.y + d.y;

      if (
        nx >= 0 && ny >= 0 &&
        nx < cols && ny < rows &&
        !visited[ny][nx] &&
        grid[ny][nx] !== 1
      ) {
        visited[ny][nx] = true;
        parent[ny][nx] = current;
        queue.push({ x: nx, y: ny });
      }
    }
  }

  let path = [];
  let p = goal;
  while (p && !(p.x === start.x && p.y === start.y)) {
    path.push(p);
    p = parent[p.y][p.x];
  }

  return path.reverse();
}

function moveRobot(path) {
  let i = 0;
  const interval = setInterval(() => {
    if (i >= path.length) {
      clearInterval(interval);
      console.log("Path Memory:", path);
      return;
    }

    grid[robotPos.y][robotPos.x] = 0;
    robotPos = path[i];
    grid[robotPos.y][robotPos.x] = 2;

    drawGrid();
    i++;
  }, 400);
}

generateGrid();
</script>

</body>
</html>
